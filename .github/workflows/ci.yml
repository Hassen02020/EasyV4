name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs fictives CI uniquement : aucune clé de production. Plusieurs pages
  # publiques construisent le client Supabase pendant le rendu serveur.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-ci-only
  # R1-07 (audit Phase 0) : le build échoue si ces secrets manquent ou
  # gardent leur valeur "dev" par défaut en NODE_ENV=production (garde-fous
  # applicatifs volontaires, voir lib/booking/price-token.ts et
  # lib/security/secret-crypto.ts). Valeurs générées ici sont propres à la
  # CI, sans rapport avec les secrets de production — le build ne fait
  # aucun appel réseau qui en dépendrait réellement.
  PRICE_TOKEN_SECRET: ${{ secrets.CI_PRICE_TOKEN_SECRET || '11111111111111111111111111111111111111111111111111111111111111' }}
  VIRTUAL_MYGO_TOKEN_SECRET: ${{ secrets.CI_VIRTUAL_MYGO_TOKEN_SECRET || '22222222222222222222222222222222222222222222222222222222222222' }}
  SUPPLIER_CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CI_SUPPLIER_CREDENTIALS_ENCRYPTION_KEY || '33333333333333333333333333333333333333333333333333333333333333' }}
  # CI-FIX-06 (2026-10-10): ces deux vars sont exigées par lib/env.ts au
  # démarrage du serveur Next.js (playwright-a11y, lighthouse). Absent du bloc
  # global précédent car ajouté après le R1-07 initial.
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-ci-only
  CRON_SECRET: placeholder-cron-secret-ci-only-32chars

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # FORMAT-CLEANUP-01 (2026-10-02) : dette R1-07 soldée — 794 fichiers
  # reformatés en un seul diff (pnpm format --write). Job désormais bloquant.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # FINANCIAL-E2E-01 : exécute les 5 suites de tests financiers qui se
  # `skip`-ent sans DATABASE_URL (convention isDbAvailable(), voir en-tête
  # de chaque fichier) contre un Postgres CI éphémère, avec le schéma réel
  # + les policies RLS réelles (drizzle/manual/*.sql) appliquées, pour
  # remplacer un skip silencieux par une preuve d'exécution réelle.
  #
  # Job séparé du `test` job existant : celui-ci garde `pnpm test` sans
  # DATABASE_URL, comportement inchangé pour le reste de la suite. Le
  # service Postgres et la base préparée ici sont détruits à la fin du job,
  # aucune donnée persistante, aucun impact production.
  financial-e2e:
    runs-on: ubuntu-24.04
    env:
      # Rôle propriétaire (superuser du conteneur) : sert à créer le schéma
      # (db:push) et à rejouer les migrations manuelles (DDL/RLS/rôles).
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Throwaway, CI-only — la base est détruite à la fin du job.
      APP_RUNTIME_PASSWORD: ci_app_runtime_throwaway_password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL (CI-FIX-07 — pré-installé sur ubuntu-24.04, aucun pull réseau)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres pg_isready -t 30
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

      - name: db:push (schéma réel depuis lib/db/schema.ts)
        env:
          DATABASE_URL: ${{ env.DATABASE_DIRECT_URL }}
        run: pnpm db:push --force

      - name: Stub schéma auth + rôles + publication Supabase (absents d'un Postgres nu, fournis nativement par Supabase)
        run: |
          # Notifications : table présente en production hors de tout fichier
          # de migration du dépôt (drizzle-kit ou manual), déjà documentée
          # dans l'en-tête de drizzle/manual/0061 ("notifications ... présents
          # en production sans trace dans aucune migration du dépôt — schéma
          # non capturé ici, seules leurs policies RLS le sont"). 0061 y pose
          # quand même une CREATE POLICY dessus (gap RLS réel trouvé en prod) :
          # stub minimal (seule colonne lue par cette policy) pour que 0061
          # s'applique intégralement au lieu d'échouer sur "relation
          # notifications does not exist".
          psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 <<'SQL'
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
            CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$ SELECT NULL::text $$;
            CREATE ROLE anon NOLOGIN;
            CREATE ROLE authenticated NOLOGIN;
            CREATE ROLE service_role NOLOGIN;
            CREATE PUBLICATION supabase_realtime;
            CREATE TABLE IF NOT EXISTS notifications (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              agency_id uuid
            );
          SQL

      - name: Créer le rôle app_runtime (avant le replay des migrations — 0068/0073 y font GRANT EXECUTE)
        run: |
          psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 <<SQL
            CREATE ROLE app_runtime LOGIN PASSWORD '$APP_RUNTIME_PASSWORD';
            GRANT USAGE ON SCHEMA public TO app_runtime;
          SQL

      # APP-RUNTIME-GRANTS-CI-01 (2026-10-13) : déplacé AVANT le replay des
      # migrations (était après, dans l'ancien step "Grants finaux", voir
      # git log). Audit : au moins 11 migrations (0084, 0092, 0109-0122)
      # font un REVOKE table-level explicite sur app_runtime pour des tables
      # censées être append-only ou restreintes (wallet_ledger,
      # partner_credit_movements, commission_settlement_entries,
      # economic_entitlements, canonical_hotels, etc.) — en reproduisant ici
      # le même GRANT large qu'accorde la ALTER DEFAULT PRIVILEGES historique
      # de production (0069) mais APRÈS le replay, l'ancien ordre annulait
      # systématiquement ces 11 REVOKE pour la seule durée de la CI, sans
      # jamais le détecter (aucun test n'assertait l'ABSENCE du privilège).
      # Prouvé empiriquement (bac à sable local, avant ce commit) :
      # has_table_privilege('app_runtime','wallet_ledger','DELETE') valait
      # `true` sous l'ancien ordre, `false` sous celui-ci — identique à la
      # production, où la ALTER DEFAULT PRIVILEGES de 0069 a eu lieu une
      # fois, avant ces 11 migrations, jamais après.
      # Ce step ne couvre QUE le niveau table (GRANT large + default
      # privileges) : les 3 GRANT EXECUTE sur fonctions restent dans le step
      # suivant, après le replay, puisque resolve_session_context/
      # current_agency_id/is_super_admin sont créées PAR les migrations
      # rejouées ensuite (0001/0012) — les déplacer ici échouerait
      # ("function does not exist").
      - name: Grants par défaut app_runtime (table-level, AVANT le replay — laisse les REVOKE des migrations tenir)
        run: |
          psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 <<'SQL'
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_runtime;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_runtime;
          SQL

      - name: Rejouer drizzle/manual/*.sql en ordre numérique ascendant
        run: |
          set -euo pipefail
          # `db:push` (étape précédente) matérialise directement l'état FINAL
          # de lib/db/schema.ts — colonnes et tables y comprises. Une partie
          # de drizzle/manual/*.sql fait ensuite, en historique, du
          # `ALTER TABLE ... ADD COLUMN` / `CREATE TABLE` NON gardé par
          # `IF NOT EXISTS` pour amener incrémentalement une base vers ce
          # même état final — cohérent en production (appliqué migration par
          # migration au fil du temps, jamais tout d'un coup après un
          # db:push déjà à l'état final), mais qui entre nécessairement en
          # collision ici puisque db:push a déjà tout créé d'un coup. Ce
          # n'est jamais un vrai problème (la colonne/table existe déjà,
          # avec la même définition, par construction — les deux chemins
          # partent du même schema.ts) : seules les erreurs "already exists"
          # sont tolérées (log + on continue) ; toute autre erreur reste
          # fatale (ON_ERROR_STOP=1 par fichier), donc un vrai problème de
          # migration échoue toujours bruyamment.
          for f in $(ls drizzle/manual/*.sql | sort -V); do
            # 0035 is the one collision file (of the 13) that ALSO defines
            # SQL functions (is_authorized_for_hotel_supplier_account,
            # owns_hotel_supplier_account) after its unguarded CREATE TABLE
            # statements — db:push already created its 4 tables, so its own
            # first CREATE TABLE fails and ON_ERROR_STOP aborts the rest of
            # the file, silently skipping those two functions too. That's a
            # real gap (unlike the other 12 collision files' trailing RLS,
            # which don't matter to the targeted scope): 0068 later REVOKEs/
            # GRANTs on is_authorized_for_hotel_supplier_account, and if 0068
            # aborts at ITS first statement for the same reason, app_runtime
            # never gets EXECUTE on lock_agency_for_debit/
            # set_agency_deposit_balance either — functions
            # lib/pro/booking-actions.ts::debitPartnerCredit genuinely calls,
            # exercised by the targeted booking-actions-concurrency test.
            # Dropping these 4 tables first lets 0035 replay end-to-end
            # (their shape doesn't matter — untouched by the targeted tests,
            # confirmed by grep) so its functions get created normally.
            if [ "$(basename "$f")" = "0035_hotel_supplier_control_plane.sql" ]; then
              echo "== Pre-drop hotel_supplier_* tables + enum types (already created by db:push) so 0035 replays end-to-end, including its 2 functions =="
              psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 <<'SQL'
                DROP TABLE IF EXISTS hotel_supplier_authorizations CASCADE;
                DROP TABLE IF EXISTS hotel_supplier_credentials CASCADE;
                DROP TABLE IF EXISTS hotel_supplier_accounts CASCADE;
                DROP TABLE IF EXISTS hotel_suppliers CASCADE;
                DROP TYPE IF EXISTS hotel_supplier_doc_status CASCADE;
                DROP TYPE IF EXISTS hotel_supplier_owner_type CASCADE;
                DROP TYPE IF EXISTS hotel_supplier_account_status CASCADE;
          SQL
            fi
            echo "== Applying $f =="
            if ! out=$(psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 -f "$f" 2>&1); then
              if echo "$out" | grep -qiE "already exists"; then
                echo "$out"
                echo "== $f : déjà appliqué via db:push (already exists) — toléré, on continue =="
              else
                echo "$out"
                echo "== $f : échec réel (pas un 'already exists') — abandon =="
                exit 1
              fi
            else
              echo "$out"
            fi
          done

      # APP-RUNTIME-GRANTS-CI-01 : ne reste ici que le niveau fonction (ne
      # peut pas être déplacé avant le replay, voir commentaire ci-dessus) —
      # le GRANT large table-level qui vivait dans cet ancien step unique
      # ("Grants finaux") est désormais posé AVANT le replay.
      - name: Grants finaux app_runtime (fonctions RLS — voir drizzle/manual/0061 §5 et 0068)
        run: |
          psql "$DATABASE_DIRECT_URL" -v ON_ERROR_STOP=1 <<'SQL'
            GRANT EXECUTE ON FUNCTION resolve_session_context(uuid) TO app_runtime;
            GRANT EXECUTE ON FUNCTION current_agency_id() TO app_runtime;
            GRANT EXECUTE ON FUNCTION is_super_admin() TO app_runtime;
          SQL

      - name: Tests financiers ciblés (DATABASE_URL = app_runtime, non-BYPASSRLS — comme en production)
        env:
          DATABASE_URL: postgresql://app_runtime:${{ env.APP_RUNTIME_PASSWORD }}@localhost:5432/postgres
        run: |
          # --experimental-test-module-mocks (Node 22.3+, présent sur le
          # node-version: 22 de ce job) : requis uniquement par
          # manual-payment-voucher-dispatch.integration.test.ts, pour
          # t.mock.module() — createServerSupabase/getCurrentAdminProfile
          # sont des exports de fonction ESM non reconfigurables, que
          # t.mock.method() ne peut pas remplacer (même limite documentée
          # dans lib/crm/__tests__/campaign-delivery-core.test.ts).
          # Purement additif pour les autres fichiers de cette liste, qui
          # n'appellent jamais t.mock.module().
          node --experimental-test-module-mocks --import tsx --test \
            lib/db/__tests__/app-runtime-grants.test.ts \
            lib/finance/__tests__/create-customer-profile.integration.test.ts \
            lib/booking/__tests__/link-guest-customer.integration.test.ts \
            lib/journeys/__tests__/journeys-core.test.ts \
            lib/pro/__tests__/booking-actions-concurrency.test.ts \
            lib/finance/__tests__/customer-wallet-concurrency.test.ts \
            lib/finance/__tests__/reconciliation.test.ts \
            lib/pro/__tests__/margins-core.test.ts \
            lib/admin/__tests__/commercial-agreements-live.test.ts \
            lib/finance/__tests__/economic-entitlements-network.test.ts \
            lib/finance/__tests__/currency-dim-01-plumbing.test.ts \
            lib/admin/__tests__/reservation-status-transition-guard-live.test.ts \
            lib/hotel-suppliers/core/__tests__/canonical-persistence-live.test.ts \
            lib/db/__tests__/rls-gap-public-tables-01-live.test.ts \
            lib/market/__tests__/market-content-rls-role-gap-live.test.ts \
            lib/payment/__tests__/reservation-webhook-core.test.ts \
            lib/payment/__tests__/paymee-reservation-webhook.test.ts \
            lib/payment/__tests__/wallet-webhook-core.test.ts \
            lib/payment/__tests__/customer-topup-webhook-core.integration.test.ts \
            lib/payment/__tests__/paymee-topup-webhook-route.integration.test.ts \
            lib/finance/__tests__/customer-topup-manual.integration.test.ts \
            lib/finance/__tests__/topup-state-machine.integration.test.ts \
            lib/finance/__tests__/wallet-journey-audit-01.integration.test.ts \
            lib/finance/__tests__/booking-financials-chain.integration.test.ts \
            lib/finance/__tests__/payment-settlement-chain.integration.test.ts \
            lib/finance/__tests__/commission-reversal-integration.test.ts \
            lib/finance/__tests__/supplier-settlement.integration.test.ts \
            lib/finance/__tests__/cancel-refund-commission-integration.test.ts \
            lib/finance/__tests__/invoice-generation-loop.integration.test.ts \
            lib/finance/__tests__/mutuelle-invoice-settlement-concurrency-live.test.ts \
            lib/finance/__tests__/mutuelle-invoice-settlement-rls-live.test.ts \
            lib/inngest/functions/__tests__/recover-mutuelle-missing-invoices-live.test.ts \
            lib/finance/__tests__/manual-payment-voucher-dispatch.integration.test.ts \
            lib/finance/__tests__/manual-payment-transfer-voucher.integration.test.ts \
            lib/finance/__tests__/manual-payment-inngest-reliability.integration.test.ts \
            lib/inngest/functions/__tests__/transfer-email-idempotency.integration.test.ts \
            lib/inngest/functions/__tests__/car-flight-email-idempotency.integration.test.ts \
            lib/inngest/__tests__/send-email-once.integration.test.ts \
            lib/crm/__tests__/campaign-safety-live.test.ts \
            lib/crm/__tests__/campaign-attribution-core-live.test.ts \
            lib/crm/__tests__/campaign-core-live.test.ts \
            lib/crm/__tests__/campaign-performance-core-live.test.ts \
            lib/crm/__tests__/campaign-persistence-core-live.test.ts \
            lib/crm/__tests__/consent-core-live.test.ts \
            lib/crm/__tests__/contact-core-live.test.ts \
            lib/crm/__tests__/customer-match-core-live.test.ts \
            lib/crm/__tests__/network-demand-capture-live.test.ts \
            lib/crm/__tests__/niche-audience-live.test.ts \
            lib/crm/__tests__/promo-checkout-core-live.test.ts \
            lib/crm/__tests__/promo-core-live.test.ts \
            lib/crm/__tests__/search-demand-core-live.test.ts \
            lib/crm/__tests__/vip-score-live.test.ts \
            lib/crm/__tests__/website-lead-capture-core-live.test.ts \
            lib/meta-leadads/__tests__/lead-capture-core.test.ts

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # R8-04 : Lighthouse CI — bloque sur LCP/FCP > seuil, non-bloquant le
  # pipeline initialement (continue-on-error: true) pour recueillir une
  # baseline avant de durcir. Rebuild ici car les artefacts .next ne sont
  # pas partagés entre jobs GitHub Actions.
  # CI-FIX-01 (2026-10-03) : ajout d'un service postgres éphémère + db:push
  # pour que le serveur Next.js puisse démarrer (getDb() ne lève plus
  # "DATABASE_URL non définie"). Sans DB, chaque page SSR retournait HTTP 500
  # et Lighthouse échouait avec ERRORED_DOCUMENT_REQUEST.
  # CI-FIX-02 (2026-10-07) : audit lecture seule (agent dédié) a trouvé que
  # ce job, contrairement à playwright-a11y ci-dessous, n'installait aucune
  # dépendance système navigateur — @lhci/cli (via chrome-launcher) compte
  # sur un Chrome déjà présent sur le runner, sans garantir les librairies
  # partagées nécessaires au rendu headless (libnss3, libgbm, etc.), d'où
  # l'erreur "NO_FCP" (Chrome démarre mais ne peint jamais). Ajout de
  # `playwright install-deps chromium` (dépendances système SEULEMENT,
  # aucun nouveau binaire téléchargé/substitué) pour fiabiliser le Chrome
  # déjà détecté par chrome-launcher, sans changer quel binaire est utilisé.
  # CI-FIX-04 (2026-10-09) : throttlingMethod=provided + preset=desktop dans
  # lighthouserc.js résout le FCP/LCP trop élevé en simulation mobile.
  # Run verte confirmée (run 37903890236, job lighthouse = success).
  # continue-on-error RETIRÉ — job BLOQUANT désormais.
  lighthouse:
    runs-on: ubuntu-24.04
    needs: [build]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-ci-lighthouse
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL (CI-FIX-07 — pré-installé sur ubuntu-24.04, aucun pull réseau)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres pg_isready -t 30
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
      - name: Schéma DB CI (db:push)
        run: pnpm db:push --force
      - name: Build (production)
        run: pnpm build
      - name: Dépendances système Chrome headless (CI-FIX-02)
        run: pnpm exec playwright install-deps chromium
      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli autorun

  # R8-05 : Playwright axe-core — bloque sur toute violation WCAG
  # serious/critical. Chromium uniquement pour la vitesse. Pages /admin et
  # /booking redirigent vers login en CI (pas d'auth) : coverage réelle sur
  # / et /login ; documenté, pas masqué.
  # CI-FIX-01 (2026-10-03) : service postgres + db:push pour que le serveur
  # Next.js démarre. continue-on-error re-ajouté pour baseline.
  # CI-FIX-04 (2026-10-09) : 0 violations WCAG confirmé (R8-05) + run verte
  # (run 37903890236). continue-on-error RETIRÉ — job BLOQUANT désormais.
  playwright-a11y:
    runs-on: ubuntu-24.04
    needs: [build]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-ci-playwright
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL (CI-FIX-07 — pré-installé sur ubuntu-24.04, aucun pull réseau)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres pg_isready -t 30
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
      - name: Schéma DB CI (db:push)
        run: pnpm db:push --force
      - name: Build (production)
        run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
      - name: Accessibility tests (axe-core / WCAG 2.1 AA)
        run: pnpm exec playwright test e2e/a11y.spec.ts --project chromium

  # VAL-01 / E1-01+E4-02 : Parcours guest hôtel complet (MYGO_MODE=virtual)
  # Utilise pnpm dev (pas pnpm start) pour que NODE_ENV=development permette
  # MYGO_MODE=virtual — resolveMyGoMode() lance une exception en production.
  # playwright.config.dev.ts : toujours pnpm dev, workers=1, timeout=120s.
  e2e-guest:
    runs-on: ubuntu-24.04
    needs: [build]
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-ci-e2e-guest
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      MYGO_MODE: virtual
      # Bypass Redis fail-closed pour le test E2E local (voir lib/booking/inventory.ts)
      INVENTORY_LOCK_DISABLED_TEST_ONLY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL (pré-installé sur ubuntu-24.04)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres pg_isready -t 30
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
      - name: Schéma DB CI (db:push)
        run: pnpm db:push --force
      - name: Vérification schéma (agencies doit exister après db:push)
        run: |
          psql "$DATABASE_URL" -c "\dt agencies" | grep -q agencies || \
            (echo "FATAL: table agencies absente après db:push" && exit 1)
      - name: Stub schéma auth (auth.uid/role/roles — requis par l'app/RLS, après db:push)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
            CREATE OR REPLACE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$ SELECT NULL::text $$;
            CREATE ROLE anon NOLOGIN;
            CREATE ROLE authenticated NOLOGIN;
            CREATE ROLE service_role NOLOGIN;
            CREATE PUBLICATION supabase_realtime;
            CREATE TABLE IF NOT EXISTS notifications (
              id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
              user_id uuid,
              title text,
              body text,
              read boolean DEFAULT false,
              created_at timestamptz DEFAULT now()
            );
          SQL
      - name: Seed CI — agence OTA (requise par getDefaultAgencyId)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
            INSERT INTO agencies (slug, name, agency_type)
            VALUES ('easy2book-ci', 'Easy2Book CI', 'ota')
            ON CONFLICT DO NOTHING;
          SQL
      - name: Seed CI — règle fiscale wildcard (requise par getActiveFiscalRuleInTx)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
            INSERT INTO fiscal_rules (
              country, module, fiscal_classification, vat_rate,
              status, effective_from, effective_to, version,
              validation_ref, note,
              created_by, tax_type
            ) VALUES (
              '*', '*', 'zero_rated', '0.00',
              'active', '2020-01-01 00:00:00+00', NULL, 1,
              'CI-seed', 'CI wildcard fiscal rule — test only',
              '00000000-0000-0000-0000-000000000000', 'percentage'
            ) ON CONFLICT DO NOTHING;
          SQL
      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps
      - name: Guest booking E2E (MYGO_MODE=virtual, pnpm dev)
        run: |
          pnpm exec playwright test \
            e2e/b2c-hotel-guest-create-live.spec.ts \
            --project chromium \
            --config playwright.config.dev.ts
