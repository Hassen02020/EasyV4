    <circle cx="55" cy="88" r="15" fill="#2a2a2a"/>
    <circle cx="55" cy="88" r="5" fill="#888"/>
    <circle cx="220" cy="88" r="22" fill="#1a1a1a"/>
    <circle cx="220" cy="88" r="15" fill="#2a2a2a"/>
    <circle cx="220" cy="88" r="5" fill="#888"/>
