    <rect x="380" y="518" width="60" height="6" rx="3"/>
    <rect x="520" y="518" width="60" height="6" rx="3"/>
    <rect x="660" y="518" width="60" height="6" rx="3"/>
    <rect x="800" y="518" width="60" height="6" rx="3"/>
