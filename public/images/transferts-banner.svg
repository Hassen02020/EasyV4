    <rect x="420" y="285" width="55" height="80"/>
    <rect x="485" y="285" width="55" height="80"/>
    <rect x="550" y="285" width="55" height="80"/>
    <rect x="615" y="285" width="55" height="80"/>
    <rect x="680" y="285" width="55" height="80"/>
    <rect x="745" y="285" width="55" height="80"/>
    <rect x="810" y="285" width="55" height="80"/>
    <rect x="875" y="285" width="55" height="80"/>
    <rect x="940" y="285" width="55" height="80"/>
    <rect x="1005" y="285" width="55" height="80"/>
    <rect x="1070" y="285" width="55" height="80"/>
    <rect x="1135" y="285" width="55" height="80"/>
    <rect x="1200" y="285" width="55" height="80"/>
    <rect x="1265" y="285" width="55" height="80"/>
    <rect x="1330" y="285" width="55" height="80"/>
