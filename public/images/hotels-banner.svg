  <g fill="#4a90c8" opacity="0.6">
    <rect x="430" y="245" width="28" height="22" rx="2"/><rect x="475" y="245" width="28" height="22" rx="2"/>
    <rect x="520" y="245" width="28" height="22" rx="2"/><rect x="565" y="245" width="28" height="22" rx="2"/>
    <rect x="610" y="245" width="28" height="22" rx="2"/>
    <rect x="430" y="285" width="28" height="22" rx="2"/><rect x="475" y="285" width="28" height="22" rx="2"/>
    <rect x="520" y="285" width="28" height="22" rx="2"/><rect x="565" y="285" width="28" height="22" rx="2"/>
    <rect x="430" y="325" width="28" height="22" rx="2"/><rect x="475" y="325" width="28" height="22" rx="2"/>
