    <ellipse cx="180" cy="345" rx="30" ry="14" fill="#2d7a2d" transform="rotate(-15,180,345)"/>
    <ellipse cx="195" cy="340" rx="28" ry="13" fill="#3a8c3a" transform="rotate(10,195,340)"/>
