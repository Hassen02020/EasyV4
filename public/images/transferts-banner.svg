  <rect x="1500" y="150" width="45" height="250" fill="#0d1828"/>
  <rect x="1488" y="150" width="69" height="40" fill="#162038"/>
  <rect x="1480" y="135" width="85" height="20" fill="#1e3a6a" rx="2"/>
