    <!-- Palm left 1 -->
    <rect x="555" y="310" width="8" height="120" fill="#5a3a1a" transform="rotate(-5,559,430)"/>
    <ellipse cx="545" cy="298" rx="40" ry="20" fill="#2d7a2d" transform="rotate(-20,545,298)"/>
    <ellipse cx="570" cy="285" rx="38" ry="18" fill="#3a8c3a" transform="rotate(10,570,285)"/>
    <ellipse cx="530" cy="288" rx="35" ry="16" fill="#2d7a2d" transform="rotate(-35,530,288)"/>
    <!-- Palm right 1 -->
    <rect x="1237" y="310" width="8" height="120" fill="#5a3a1a" transform="rotate(5,1241,430)"/>
    <ellipse cx="1255" cy="298" rx="40" ry="20" fill="#2d7a2d" transform="rotate(20,1255,298)"/>
    <ellipse cx="1230" cy="285" rx="38" ry="18" fill="#3a8c3a" transform="rotate(-10,1230,285)"/>
    <ellipse cx="1270" cy="288" rx="35" ry="16" fill="#2d7a2d" transform="rotate(35,1270,288)"/>
