name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # R1-07 (audit Phase 0) : le build échoue si ces secrets manquent ou
  # gardent leur valeur "dev" par défaut en NODE_ENV=production (garde-fous
  # applicatifs volontaires, voir lib/booking/price-token.ts et
  # lib/security/secret-crypto.ts). Valeurs générées ici sont propres à la
  # CI, sans rapport avec les secrets de production — le build ne fait
  # aucun appel réseau qui en dépendrait réellement.
  PRICE_TOKEN_SECRET: ${{ secrets.CI_PRICE_TOKEN_SECRET || '11111111111111111111111111111111111111111111111111111111111111' }}
  VIRTUAL_MYGO_TOKEN_SECRET: ${{ secrets.CI_VIRTUAL_MYGO_TOKEN_SECRET || '22222222222222222222222222222222222222222222222222222222222222' }}
  SUPPLIER_CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CI_SUPPLIER_CREDENTIALS_ENCRYPTION_KEY || '33333333333333333333333333333333333333333333333333333333333333' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # R1-07 : format:check échoue actuellement sur 744 fichiers jamais passés
  # au formatter (dette historique, hors périmètre de ce chantier) — job
  # non bloquant volontairement (continue-on-error). Reformater tout le
  # dépôt en un seul diff est un chantier séparé, à proposer explicitement.
  format:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
