<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="40%" stop-color="#1a2848"/>
      <stop offset="100%" stop-color="#2a3a60"/>
    </linearGradient>
    <radialGradient id="airportLight" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#4070c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0a1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
  </defs>
  <!-- Night sky -->
  <rect width="1800" height="600" fill="url(#sky)"/>
  <rect width="1800" height="600" fill="url(#airportLight)"/>
  <!-- Stars -->
  <g fill="white">
    <circle cx="100" cy="30" r="1.5" opacity="0.9"/><circle cx="220" cy="55" r="1" opacity="0.8"/>
    <circle cx="350" cy="25" r="2" opacity="0.9"/><circle cx="480" cy="50" r="1.5" opacity="0.7"/>
    <circle cx="590" cy="20" r="1" opacity="0.8"/><circle cx="680" cy="65" r="1.5" opacity="0.9"/>
    <circle cx="820" cy="35" r="1" opacity="0.7"/><circle cx="920" cy="55" r="2" opacity="0.9"/>
    <circle cx="1040" cy="28" r="1.5" opacity="0.8"/><circle cx="1140" cy="48" r="1" opacity="0.7"/>
    <circle cx="1260" cy="22" r="2" opacity="0.9"/><circle cx="1380" cy="58" r="1.5" opacity="0.8"/>
    <circle cx="1480" cy="35" r="1" opacity="0.7"/><circle cx="1600" cy="70" r="1.5" opacity="0.9"/>
    <circle cx="1700" cy="42" r="1" opacity="0.8"/>
    <circle cx="160" cy="120" r="1" opacity="0.6"/><circle cx="300" cy="100" r="1.5" opacity="0.7"/>
    <circle cx="440" cy="130" r="1" opacity="0.6"/><circle cx="580" cy="108" r="1.5" opacity="0.7"/>
    <circle cx="720" cy="125" r="1" opacity="0.6"/><circle cx="960" cy="115" r="1.5" opacity="0.7"/>
    <circle cx="1100" cy="140" r="1" opacity="0.6"/><circle cx="1300" cy="118" r="1.5" opacity="0.7"/>
    <circle cx="1540" cy="130" r="1" opacity="0.6"/>
  </g>
  <!-- Airplane in distance (landing) -->
  <g transform="translate(1350,140) rotate(-8)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="55" ry="7" fill="#e0e8f0"/>
    <path d="M55 0 Q70 0 75 4 Q70 8 55 0Z" fill="#c8d4e0"/>
    <path d="-55 0 Q-65 0 -68 3 L-55 0Z" fill="#c8d4e0"/>
    <path d="M5 0 L-15 28 Q-20 32 -10 26 L20 0Z" fill="#d0dce8"/>
    <path d="M5 0 L-15 -28 Q-20 -32 -10 -26 L20 0Z" fill="#d0dce8"/>
    <rect x="-55" y="-3" width="110" height="3" rx="1" fill="#2a5a9a" opacity="0.5"/>
