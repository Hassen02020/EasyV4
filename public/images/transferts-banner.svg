    <rect x="1685" y="285" width="8" height="6" rx="1"/><rect x="1705" y="285" width="8" height="6" rx="1"/>
    <rect x="1685" y="305" width="8" height="6" rx="1"/>
    <rect x="1762" y="315" width="8" height="6" rx="1"/><rect x="1742" y="315" width="8" height="6" rx="1"/>
    <rect x="1762" y="335" width="8" height="6" rx="1"/>
