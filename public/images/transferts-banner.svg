    <rect x="200" y="440" width="6" height="55" fill="#2a3a50"/>
    <ellipse cx="203" cy="438" rx="15" ry="5" fill="#3a5070"/>
    <ellipse cx="203" cy="436" rx="12" ry="4" fill="#f5dd80" opacity="0.6"/>
    <circle cx="203" cy="436" r="3" fill="#ffffcc" opacity="0.9"/>
    <rect x="1594" y="440" width="6" height="55" fill="#2a3a50"/>
