<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a6b9e"/>
      <stop offset="50%" stop-color="#2d8fd4"/>
      <stop offset="100%" stop-color="#4ba3d8"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e7bb5"/>
      <stop offset="100%" stop-color="#0d4f7a"/>
    </linearGradient>
    <radialGradient id="sun" cx="70%" cy="25%" r="15%">
      <stop offset="0%" stop-color="#fff5c0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffd070" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2d8fd4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sky -->
  <rect width="1800" height="600" fill="url(#sky)"/>
  <rect width="1800" height="600" fill="url(#sun)"/>
  <!-- Clouds -->
  <g fill="white" opacity="0.6">
    <ellipse cx="200" cy="80" rx="80" ry="25"/>
    <ellipse cx="260" cy="70" rx="60" ry="20"/>
    <ellipse cx="150" cy="75" rx="50" ry="18"/>
    <ellipse cx="1400" cy="100" rx="100" ry="28"/>
    <ellipse cx="1480" cy="90" rx="70" ry="22"/>
    <ellipse cx="1340" cy="95" rx="60" ry="20"/>
    <ellipse cx="700" cy="130" rx="70" ry="20"/>
    <ellipse cx="760" cy="120" rx="50" ry="16"/>
  </g>
  <!-- Sea -->
  <rect x="0" y="400" width="1800" height="200" fill="url(#sea)"/>
