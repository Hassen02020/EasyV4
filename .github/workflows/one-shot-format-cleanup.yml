name: One-shot format cleanup

on:
  push:
    branches: [ci-format-cleanup-01]

permissions:
  contents: write

jobs:
  format-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format known pre-existing drift
        run: pnpm exec prettier --write app/'(internal)'/admin/site/page.tsx components/footer-client.tsx docs/ROADMAP.md lib/admin/public-site-actions.ts lib/db/schema/public-site.ts
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-format-cleanup.yml
      - name: Commit formatted files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/'(internal)'/admin/site/page.tsx components/footer-client.tsx docs/ROADMAP.md lib/admin/public-site-actions.ts lib/db/schema/public-site.ts .github/workflows/one-shot-format-cleanup.yml
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "chore(format): clean pre-existing formatting drift"
          git push
