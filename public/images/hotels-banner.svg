    <ellipse cx="740" cy="390" rx="22" ry="8" fill="#e87c2d" opacity="0.9"/>
    <rect x="738" y="390" width="4" height="30" fill="#5a3a1a"/>
    <ellipse cx="860" cy="390" rx="22" ry="8" fill="#2d7ae8" opacity="0.9"/>
    <rect x="858" y="390" width="4" height="30" fill="#5a3a1a"/>
    <ellipse cx="980" cy="390" rx="22" ry="8" fill="#e87c2d" opacity="0.9"/>
    <rect x="978" y="390" width="4" height="30" fill="#5a3a1a"/>
