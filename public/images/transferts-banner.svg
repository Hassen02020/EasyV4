  <rect x="50" y="250" width="70" height="230" fill="#0a1420"/>
  <rect x="100" y="320" width="80" height="160" fill="#0d1828"/>
  <!-- City lights on left buildings -->
  <g fill="#2a4a80" opacity="0.7">
    <rect x="55" y="265" width="8" height="6" rx="1"/><rect x="75" y="265" width="8" height="6" rx="1"/>
    <rect x="55" y="285" width="8" height="6" rx="1"/><rect x="75" y="285" width="8" height="6" rx="1"/>
    <rect x="55" y="305" width="8" height="6" rx="1"/><rect x="75" y="305" width="8" height="6" rx="1"/>
    <rect x="55" y="325" width="8" height="6" rx="1"/>
    <rect x="7" y="315" width="8" height="6" rx="1"/><rect x="27" y="315" width="8" height="6" rx="1"/>
    <rect x="7" y="335" width="8" height="6" rx="1"/><rect x="27" y="335" width="8" height="6" rx="1"/>
