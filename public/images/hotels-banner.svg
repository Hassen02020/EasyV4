    <rect x="1609" y="350" width="6" height="90" fill="#5a3a1a"/>
    <ellipse cx="1620" cy="345" rx="30" ry="14" fill="#2d7a2d" transform="rotate(15,1620,345)"/>
    <ellipse cx="1605" cy="340" rx="28" ry="13" fill="#3a8c3a" transform="rotate(-10,1605,340)"/>
  </g>
  <!-- Pool terrace -->
  <rect x="700" y="390" width="400" height="30" fill="#b0d4ea" rx="4" opacity="0.8"/>
  <!-- Pool water glimmer -->
  <path d="M710 400 Q800 395 890 400 Q980 405 1090 400" fill="none" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- Umbrellas by pool -->
