    <rect x="685" y="290" width="45" height="70" rx="1"/>
    <rect x="815" y="290" width="45" height="70" rx="1"/>
    <rect x="945" y="290" width="45" height="70" rx="1"/>
    <rect x="1075" y="290" width="45" height="70" rx="1"/>
    <rect x="1205" y="290" width="45" height="70" rx="1"/>
