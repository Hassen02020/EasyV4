  <path d="M0 450 Q200 440 400 455 Q600 470 800 455 Q1000 440 1200 455 Q1400 470 1600 455 Q1700 448 1800 455 L1800 465 Q1700 458 1600 465 Q1400 480 1200 465 Q1000 450 800 465 Q600 480 400 465 Q200 450 0 465Z" fill="white" opacity="0.1"/>
