  <!-- Hotel building - main -->
  <rect x="650" y="150" width="500" height="280" fill="#f5f0e8"/>
  <!-- Hotel windows grid -->
  <g fill="#4a90c8" opacity="0.7">
    <rect x="680" y="180" width="30" height="25" rx="2"/><rect x="730" y="180" width="30" height="25" rx="2"/>
    <rect x="780" y="180" width="30" height="25" rx="2"/><rect x="830" y="180" width="30" height="25" rx="2"/>
    <rect x="880" y="180" width="30" height="25" rx="2"/><rect x="930" y="180" width="30" height="25" rx="2"/>
    <rect x="980" y="180" width="30" height="25" rx="2"/><rect x="1030" y="180" width="30" height="25" rx="2"/>
    <rect x="1080" y="180" width="30" height="25" rx="2"/>
    <rect x="680" y="225" width="30" height="25" rx="2"/><rect x="730" y="225" width="30" height="25" rx="2"/>
    <rect x="780" y="225" width="30" height="25" rx="2"/><rect x="830" y="225" width="30" height="25" rx="2"/>
    <rect x="880" y="225" width="30" height="25" rx="2"/><rect x="930" y="225" width="30" height="25" rx="2"/>
    <rect x="980" y="225" width="30" height="25" rx="2"/><rect x="1030" y="225" width="30" height="25" rx="2"/>
    <rect x="1080" y="225" width="30" height="25" rx="2"/>
    <rect x="680" y="270" width="30" height="25" rx="2"/><rect x="730" y="270" width="30" height="25" rx="2"/>
    <rect x="780" y="270" width="30" height="25" rx="2"/><rect x="830" y="270" width="30" height="25" rx="2"/>
    <rect x="880" y="270" width="30" height="25" rx="2"/><rect x="930" y="270" width="30" height="25" rx="2"/>
    <rect x="980" y="270" width="30" height="25" rx="2"/><rect x="1030" y="270" width="30" height="25" rx="2"/>
    <rect x="1080" y="270" width="30" height="25" rx="2"/>
    <rect x="680" y="315" width="30" height="25" rx="2"/><rect x="730" y="315" width="30" height="25" rx="2"/>
    <rect x="780" y="315" width="30" height="25" rx="2"/><rect x="830" y="315" width="30" height="25" rx="2"/>
    <rect x="880" y="315" width="30" height="25" rx="2"/><rect x="930" y="315" width="30" height="25" rx="2"/>
    <rect x="980" y="315" width="30" height="25" rx="2"/><rect x="1030" y="315" width="30" height="25" rx="2"/>
    <rect x="1080" y="315" width="30" height="25" rx="2"/>
  </g>
