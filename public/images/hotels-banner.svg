  <!-- Tunisian flag hint - red and white -->
  <rect x="895" y="138" width="10" height="7" fill="#e00020" opacity="0.8"/>
  <!-- Building ground shadow -->
  <ellipse cx="900" cy="435" rx="500" ry="15" fill="#0d4f7a" opacity="0.3"/>
